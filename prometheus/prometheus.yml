global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: n8n
    metrics_path: /metrics
    static_configs:
      - targets: ["n8n:5678"]
  - job_name: ollama
    metrics_path: /metrics
    static_configs:
      - targets: ["ollama-metrics:8080"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
